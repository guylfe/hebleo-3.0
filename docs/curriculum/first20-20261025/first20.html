      "anchor": "Attach meanings to familiar people and places.",
      "prerequisites": "BGD בגד; PREFIXES-MHV מ,ה,ו",
      "sources": [
        {
          "presentation": "https://drive.google.com/file/d/1ImMGqVDWT8BMN63xay1-DT7ug3Z1W9mr/view",
          "slides": [

          "wordpressUrl": "https://hebleo.com/courses/hebleo-hebrew-learning-platform/lessons/lesson-3-3-in-that-belonging/",

        }
      ],
      "pages": [
        {
          "type": "reading",
          "stage": "Learn",
          "title": "In a place",
          "html": "\u003cp class=\"example\">\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">הדג בגן.\u003c/span>\u003cspan>The fish is in a garden / in the garden, depending on the supplied reading and context.\u003c/span>\u003c/p>\u003cp>\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">ב־\u003c/span> attaches to the place. Pointed \u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">בְּגַן\u003c/span> and \u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">בַּגַּן\u003c/span> distinguish in a garden from in the garden. In ordinary unpointed print both appear as \u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">בגן\u003c/span>.\u003c/p>\u003cp>Learn the supplied reading and meaning; do not grade this distinction from unpointed spelling alone.\u003c/p>",
          "id": "PREFIXES-BL-SHEL.learn.1",
          "provenance": "adapted-from-human-source",
          "sourceRefs": [
            {
              "presentation": "https://drive.google.com/file/d/1ImMGqVDWT8BMN63xay1-DT7ug3Z1W9mr/view",
              "slides": [

              "wordpressPostId": 25477,
              "wordpressUrl": "https://hebleo.com/courses/hebleo-hebrew-learning-platform/lessons/lesson-3-3-in-that-belonging/",
              "adaptation": "The relative prefix ש־ from the same source is deferred. Current examples use known words. Earlier אבל is a selected usefulness adaptation."
            }
          ]
        },
        {
          "type": "reading",
          "stage": "Learn",
          "title": "To someone; belonging to someone",
          "html": "\u003cp class=\"example\">\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">לאמא\u003c/span>\u003cspan>to Mom / for Mom\u003c/span>\u003c/p>\u003cp class=\"example\">\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">המתנה של אמא.\u003c/span>\u003cspan>The gift belongs to Mom; in context, Mom’s gift.\u003c/span>\u003c/p>\u003cp>\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">ל־\u003c/span> attaches. \u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">של\u003c/span> is a separate word linking a possession to its owner.\u003c/p>\u003cp class=\"example\">\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">הבגד של התלמיד\u003c/span>\u003cspan>the student’s garment — a noun phrase\u003c/span>\u003c/p>\u003cp>A phrase can name something without making a complete statement; context and the sentence around it matter.\u003c/p>",
          "id": "PREFIXES-BL-SHEL.learn.2",
          "provenance": "adapted-from-human-source",
          "sourceRefs": [

            }

        {

          "title": "Connect two familiar statements",
          "html": "\u003cp class=\"example\">\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">הוא בבית, אבל היא בגן.\u003c/span>\u003cspan>He is at home, but she is in the garden.\u003c/span>\u003c/p>\u003cp>\u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">אבל\u003c/span> means but. Both sides already use familiar sentence pieces. Its contrast differs from the later “not X but Y” use of \u003cspan lang=\"he\" dir=\"rtl\" class=\"he\">אלא\u003c/span>.\u003c/p>",

</script><script>'use strict';
(() => {
const pack=JSON.parse(document.getElementById('lesson-data').textContent),lessons=pack.lessons,key='hebleo-first20-preview-v1';
const $=s=>document.querySelector(s),el=(tag,attrs={},text)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v);}if(text!==undefined)n.textContent=text;return n;};
let state={pages:{},lessons:{},responses:{},last:null};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.pages&&saved.responses&&saved.lessons)state=saved;}catch{}
let li=0,pi=0,timer=null,deadline=0,running=false,selected=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('#storage').textContent='Progress is saved only in this browser.';}catch{$('#storage').textContent='Browser storage is unavailable. This visit still works; export your progress to keep it.';}}
function route(){const raw=decodeURIComponent(location.hash.slice(1)).split('/'),id=pack.lessons.some(l=>l.id===raw[0])?raw[0]:state.last?.lesson;li=Math.max(0,lessons.findIndex(l=>l.id===id));const lesson=lessons[li];pi=Math.max(0,lesson.pages.findIndex(p=>p.id===(raw[1]||state.last?.page)));render();}
function cancelTimer(){clearTimeout(timer);timer=null;running=false;deadline=0;}
function current(){return lessons[li].pages[pi];}
function mark(){state.pages[current().id]=true;save();}
function ready(value){$('#next').disabled=!value;}
function go(l,p){cancelTimer();li=l;pi=p;const target='#'+encodeURIComponent(lessons[li].id)+'/'+encodeURIComponent(current().id);history.replaceState(null,'',target);render();$('#page-title').focus();window.scrollTo?.({top:0,behavior:'instant'});}
function addButton(parent,text,fn,attrs={}){const b=el('button',{type:'button',...attrs},text);b.addEventListener('click',fn);parent.append(b);return b;}
function feedback(box,text,kind='note'){box.replaceChildren(el('p',{class:'feedback '+kind,role:'status'},text));}
function render(){
cancelTimer();selected=null;const l=lessons[li],p=current(),body=$('#content');body.replaceChildren();
$('#lesson-title').textContent=l.title;$('#content-id').textContent=l.id;$('#position').textContent=`Lesson ${li+1} of ${lessons.length}`;$('#stage').textContent=p.stage;$('#page-title').textContent=p.title;$('#page-count').textContent=`Page ${pi+1} of ${l.pages.length}`;$('#progress').max=l.pages.length;$('#progress').value=l.pages.filter(x=>state.pages[x.id]).length;$('#back').disabled=pi===0;$('#next').textContent=p.type==='complete'?'Next lesson':'Continue';$('#next').hidden=false;ready(false);state.last={lesson:l.id,page:p.id};save();renderMenu();renderSources(l);
if(p.type==='reading'){body.innerHTML=p.html;ready(true);}
if(p.type==='choice')renderChoice(body,p);
if(p.type==='vocabulary')renderVocab(body,p);
if(p.type==='recall')renderRecall(body,p);
if(p.type==='timedRecall')renderTimed(body,p);
if(p.type==='complete'){
body.innerHTML=p.html;const required=l.pages.filter(x=>x.type!=='complete'),remaining=required.filter(x=>!state.pages[x.id]);
if(!remaining.length){mark();state.lessons[l.id]=true;save();body.append(el('p',{class:'feedback good',role:'status'},'Lesson complete.'));ready(true);}
else{body.append(el('p',{},`${remaining.length} page${remaining.length===1?'':'s'} still to finish.`));addButton(body,'Return to the next unfinished page',()=>go(li,l.pages.findIndex(x=>x.id===remaining[0].id)));}
if(li===lessons.length-1){$('#next').textContent='Back to the lesson list';}
}
const pages=$('#page-select');pages.replaceChildren(...l.pages.map((x,i)=>el('option',{value:String(i)},`${i+1}. ${x.stage} — ${x.title}${state.pages[x.id]?' ✓':''}`)));pages.value=String(pi);
}
function renderChoice(body,p){body.append(el('p',{},p.prompt));const group=el('div',{role:'radiogroup','aria-label':p.prompt,class:'choices'}),out=el('div');body.append(group);const buttons=[];
p.options.forEach((text,i)=>{const b=addButton(group,text,()=>{selected=i;buttons.forEach((b,j)=>{b.setAttribute('aria-checked',String(i===j));b.tabIndex=i===j?0:-1;b.classList.toggle('selected',i===j);});check.disabled=false;},{role:'radio','aria-checked':'false',tabindex:i===0?'0':'-1',class:'choice',dir:'auto'});b.addEventListener('keydown',e=>{const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!step)return;e.preventDefault();const next=buttons[(i+step+buttons.length)%buttons.length];next.focus();next.click();});buttons.push(b);});
const check=addButton(body,'Check answer',()=>{if(selected===null)return;state.responses[p.id]={selected,answer: p.options[selected],checked:true,correct:selected===p.answer};save();buttons.forEach(b=>b.disabled=true);check.disabled=true;feedback(out,(selected===p.answer?'Correct. ':'Compare your answer. ')+p.explanation,selected===p.answer?'good':'review');out.append(el('p',{dir:'auto'},'Model answer: '+p.options[p.answer]));mark();ready(true);addButton(out,'Try again',()=>{delete state.responses[p.id];render();});},{class:'primary'});check.disabled=true;body.append(out);
const old=state.responses[p.id];if(old?.checked&&Number.isInteger(old.selected)&&old.selected>=0&&old.selected<p.options.length){buttons[old.selected].click();check.click();}
}
function renderVocab(body,p){body.append(el('p',{},'Say or recall a meaning, then select the word to reveal it.'));const grid=el('div',{class:'word-grid'}),seen=new Set((state.responses[p.id]?.seen||[]).filter(id=>p.words.some(w=>w.id===id)));body.append(grid);const counter=el('p',{role:'status',class:'muted'});body.append(counter);
const update=()=>{counter.textContent=`${seen.size} of ${p.words.length} meanings reviewed`;state.responses[p.id]={seen:[...seen]};save();if(seen.size===p.words.length){mark();ready(true);}};
for(const w of p.words){const b=el('button',{type:'button',class:'word-card','aria-expanded':'false'}),word=el('span',{lang:'he',dir:'rtl',class:'he'},w.he),meaning=el('span',{class:'word-meaning'},'Reveal meaning');b.append(word,meaning);b.addEventListener('click',()=>{const show=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(show));meaning.textContent=show?w.meaning:'Reveal meaning';if(show)seen.add(w.id);update();});grid.append(b);}addButton(body,'Hide all meanings for another recall round',()=>{for(const b of grid.querySelectorAll('button[aria-expanded="true"]'))b.click();});update();}
function renderRecall(body,p,options={}){const prompt=el('p',{},p.prompt),label=el('label',{class:'input-label'},'Your attempt'),input=el('textarea',{rows:2,dir:'auto','aria-label':'Your attempt',autocomplete:'off',spellcheck:'false'}),out=el('div');label.append(input);body.append(prompt,label);const button=addButton(body,'Commit and reveal a model',()=>{if(!input.value.trim())return;state.responses[p.id]={attempt:input.value,checked:true,mode:options.mode||'self-check'};save();input.readOnly=true;button.disabled=true;out.replaceChildren(el('p',{class:'muted'},'One model answer — other correct wording may be possible.'),el('p',{class:'model',dir:'auto'},p.answer));if(options.exact){const equal=input.value.replace(/\s/g,'')===p.answer;out.prepend(el('p',{class:'feedback '+(equal?'good':'review'),role:'status'},equal?'You recalled all the digits.':'Compare the two strings; this is practice, not a score.'));}const controls=el('div',{class:'row'});addButton(controls,'I matched the model',()=>{state.responses[p.id].selfAssessment='matched';save();feedback(out,'Recorded: matched the model.','good');});addButton(controls,'I want to review it',()=>{state.responses[p.id].selfAssessment='review';save();feedback(out,'Review noted. You can revisit this page at any time.');});out.append(controls);mark();ready(true);},{class:'primary'});button.disabled=true;body.append(out);input.addEventListener('input',()=>button.disabled=!input.value.trim());const old=state.responses[p.id];if(old?.checked&&!options.fresh){input.value=old.attempt;button.disabled=false;button.click();}}
function renderTimed(body,p){body.append(el('p',{},'Press Play to show the number for ten seconds. It will hide automatically. Leaving this page cancels the attempt.'));const number=el('div',{id:'timed-value',class:'digits timer-number',dir:'ltr','aria-label':'Number to remember'}),status=el('p',{id:'timer-status',role:'status','aria-live':'polite'},'Ready when you are.'),controls=el('div',{class:'row'}),answer=el('div');body.append(number,status,controls,answer);number.hidden=true;
const finish=mode=>{cancelTimer();number.hidden=true;number.textContent='';status.textContent=mode==='timed'?'Ten seconds finished. What do you remember?':'The number is hidden. Try to recall it.';play.disabled=false;study.disabled=false;answer.replaceChildren();renderRecall(answer,{...p,answer:p.value},{exact:true,fresh:true,mode});};
const start=()=>{cancelTimer();delete state.responses[p.id];ready(false);answer.replaceChildren();number.hidden=false;number.textContent=p.value;status.textContent='The number is visible for ten seconds.';play.disabled=true;study.disabled=true;running=true;deadline=performance.now()+p.durationMs;const tick=()=>{if(!running)return;const left=deadline-performance.now();if(left<=0){finish('timed');return;}timer=setTimeout(tick,Math.min(left,100));};tick();};
const play=addButton(controls,'Play · 10 seconds',start,{id:'play-timer',class:'primary'});const study=addButton(controls,'Study without a timer',()=>{cancelTimer();ready(false);answer.replaceChildren();number.textContent=p.value;number.hidden=false;status.textContent='Untimed study mode. Hide the number when you are ready to recall it.';play.disabled=false;study.disabled=true;addButton(answer,'Hide and recall',()=>finish('untimed'));},{id:'study-untimed'});
addButton(controls,'Reset',()=>render());if(state.pages[p.id]){body.append(el('p',{class:'muted'},'You have completed this practice before. Replay it, or continue.'));ready(true);}
}
function renderMenu(){const list=$('#lesson-list');list.replaceChildren();lessons.forEach((l,i)=>{const b=addButton(list,`${i+1}. ${l.title}`,()=>{go(i,0);$('#contents').open=false;},{class:i===li?'current':'','aria-current':i===li?'step':'false'});b.append(el('small',{},l.id+(state.lessons[l.id]?' · complete':'')));});$('#completion').textContent=`${lessons.filter(l=>state.lessons[l.id]).length} / ${lessons.length} lessons complete`;}
function renderSources(l){const box=$('#sources-body');box.replaceChildren(el('p',{},'Adapted draft for Guy’s review. Source presentation/text was read; linked videos were not watched or transcribed for this draft.'));for(const s of l.sources){if(s.presentation&&s.slides.length){const a=el('a',{href:s.presentation,target:'_blank',rel:'noopener'},'Original presentation — slides '+s.slides.join(', '));box.append(el('p',{},''));box.lastChild.append(a);}if(s.wordpressUrl){const a=el('a',{href:s.wordpressUrl,target:'_blank',rel:'noopener'},'Original lesson · WordPress '+s.wordpressPostId);box.append(el('p',{},''));box.lastChild.append(a);}box.append(el('p',{},s.adaptation));}box.append(el('p',{},'Native audio and final curated Nikkud are authoring work. Adapted wording and checks are not final linguistic approval.'));}
$('#next').addEventListener('click',()=>{if($('#next').disabled)return;mark();if(current().type==='complete'){if(li<lessons.length-1)go(li+1,0);else{$('#contents').open=true;$('#contents').scrollIntoView();}}else go(li,Math.min(pi+1,lessons[li].pages.length-1));});
$('#back').addEventListener('click',()=>{if(pi>0)go(li,pi-1);});$('#page-select').addEventListener('change',e=>go(li,Number(e.target.value)));window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){cancelTimer();render();$('#timer-status').textContent='The attempt was cancelled while this page was hidden. Press Play for a fresh ten seconds.';}});
$('#export-progress').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({kind:'hebleo-preview-progress',revision:pack.revision,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a',{href:url,download:'hebleo-first20-progress.json'});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
window.HebleoPreview={pack,getState:()=>structuredClone(state),go,render,getPosition:()=>({lesson:lessons[li].id,page:current().id})};route();
})();
