name: WordPress study reference checks
on:
  push:
    paths:
      - 'adapters/wordpress/**'
      - 'public/conjugation/**'
      - 'qa-tests/verify-approved-conjugation-release.mjs'
      - '.github/workflows/wordpress-study.yml'
  pull_request:
    paths:
      - 'adapters/wordpress/**'
      - 'public/conjugation/**'
      - 'qa-tests/verify-approved-conjugation-release.mjs'
      - '.github/workflows/wordpress-study.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reference environment
        run: |
          php --version
          python3 -m venv "$RUNNER_TEMP/fsrs-reference"
          "$RUNNER_TEMP/fsrs-reference/bin/pip" install --disable-pip-version-check typing_extensions==4.15.0
      - name: Pinned upstream and PHP adapter
        run: |
          "$RUNNER_TEMP/fsrs-reference/bin/python" adapters/wordpress/study-scheduler/test-upstream.py "$(command -v php)" "$RUNNER_TEMP/fsrs-vectors"
          php adapters/wordpress/study-scheduler/adapter-test.php
          php -l adapters/wordpress/study-scheduler/wordpress.php
      - name: Frame source and message boundaries
        run: |
          node --check adapters/wordpress/shared-cards/frame-child.js
          node --check adapters/wordpress/shared-cards/frame-host.js
          node --test adapters/wordpress/shared-cards/frame-host.test.mjs
      - name: Follow-up dispatch and source checks
        run: |
          php -l adapters/wordpress/followup/state.php
          php -l adapters/wordpress/followup/frontend.php
          php adapters/wordpress/followup/front-test.php
          node --check adapters/wordpress/followup/client.js
      - name: Background review source guards
        run: |
          php -l adapters/wordpress/background-review/protocol.php
          php -l adapters/wordpress/background-review/native.php
          php -l adapters/wordpress/background-review/native-transport.php
          php -l adapters/wordpress/background-review/protocol-probe.php
          node --check adapters/wordpress/background-review/client.js
          node --check adapters/wordpress/background-review/generate.mjs
      - name: Conjugation package and WordPress access boundary
        run: |
          node qa-tests/verify-approved-conjugation-release.mjs
          php -l adapters/wordpress/conjugation/conjugation.php
          php adapters/wordpress/conjugation/access-evidence/policy-replay.test.php
          node --test adapters/wordpress/conjugation/package.test.mjs adapters/wordpress/conjugation/direct-access.test.mjs
